<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift Collection Memes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B3FD4}a:hover{color:#4B22A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF4F9; font-family: 'DM Sans', sans-serif; color: #3E0A2A">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 16px 40px 16px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Collections.dc.html" aria-label="Back to collections" style="width: 48px; height: 48px; border-radius: 999px; background: #FFD8EC; color: #3E0A2A; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <button aria-label="More options" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #FFD8EC; color: #3E0A2A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 0.9; letter-spacing: -3px; color: #3E0A2A">Memes</h1>
      <button style="align-self: flex-start; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFD8EC; color: #3E0A2A; font: 500 14px 'DM Sans', sans-serif; display: flex; align-items: center; gap: 8px; cursor: pointer">
        Fills with “meme or joke image”
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
      </button>
      <div style="font-size: 15px; color: #6E3A57">143 screenshots · 312 MB</div>
    </div>

    <a href="Review.dc.html" style="height: 72px; border-radius: 999px; background: #3E0A2A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 26px">
      <span style="display: flex; flex-direction: column">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px">Review 12 unsure</span>
        <span style="font-size: 13px; color: #FFD8EC">Swipe to keep or remove</span>
      </span>
      <span style="width: 54px; height: 54px; border-radius: 999px; background: #C6F24E; color: #1E2B00; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <div role="group" aria-label="Filter" style="display: flex; gap: 6px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="9">
        <div style="{{t.tile}}">
          <div style="width: 75%; height: 7px; border-radius: 4px; background: #1E1530"></div>
          <div style="{{t.blob}}"></div>
          <div style="width: 60%; height: 7px; border-radius: 4px; background: #1E1530"></div>
          <sc-if value="{{t.kept}}" hint-placeholder-val="{{false}}">
            <span aria-label="Kept by you" style="position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 999px; background: #3E0A2A; color: #C6F24E; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
            </span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const f = this.state.filter;
    const pill = (id, label) => ({
      label,
      pick: () => this.setState({ filter: id }),
      style: 'height: 44px; padding: 0 18px; border-radius: ' + (f === id ? '14px' : '999px') + '; border: 0; cursor: pointer; font: 700 14px \'DM Sans\', sans-serif; transition: border-radius 200ms; background: ' + (f === id ? '#3E0A2A' : '#FFD8EC') + '; color: ' + (f === id ? '#FFFFFF' : '#3E0A2A') + ';'
    });
    const bgs = ['#FFF1C2', '#FFE0D1', '#E6F7C9', '#F0E6FF', '#DCEBFF', '#FFE6EF', '#FFF4E3', '#E3F6EA', '#FFD8EC'];
    const blobs = ['#FFB86B', '#FF8FC7', '#9BCB2C', '#B79CFF', '#5AA2FF', '#FF8A65', '#FFB86B', '#6ED39C', '#B79CFF'];
    const all = bgs.map((bg, i) => ({
      kept: i % 4 === 1,
      tile: 'position: relative; height: 150px; border-radius: 18px; background: ' + bg + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;',
      blob: 'width: 52px; height: 52px; border-radius: ' + (i % 3 === 0 ? '999px' : i % 3 === 1 ? '16px' : '999px 999px 12px 12px') + '; background: ' + blobs[i] + ';'
    }));
    const thumbs = f === 'kept' ? all.filter((t) => t.kept) : f === 'auto' ? all.filter((t) => !t.kept) : all;
    return { filters: [pill('all', 'All 143'), pill('auto', 'Auto 131'), pill('kept', 'Kept 12')], thumbs };
  }
}
</script>
</body>
</html>
