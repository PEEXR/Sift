<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift Collections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B3FD4}a:hover{color:#4B22A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF7FF; font-family: 'DM Sans', sans-serif; color: #1E1530">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 28px 16px 120px 16px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 58px; line-height: 0.95; letter-spacing: -2.5px; color: #2A1450">Collections</h1>
      <div style="font-size: 15px; color: #5B5470; padding-left: 4px">4 collections · fill themselves from a description</div>
    </div>

    <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
      <a href="{{c.href}}" style="{{c.card}}">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -1px">{{c.name}}</div>
            <div style="font-size: 14px; opacity: 0.85">“{{c.desc}}”</div>
          </div>
          <sc-if value="{{c.hasReview}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 999px; background: #2A1450; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">
              <span style="width: 8px; height: 8px; border-radius: 999px; background: #C6F24E"></span>{{c.review}} to review
            </span>
          </sc-if>
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: space-between">
          <div style="display: flex; align-items: center">
            <div style="{{c.s1}}"></div>
            <div style="{{c.s2}}"></div>
            <div style="{{c.s3}}"></div>
          </div>
          <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.9; letter-spacing: -1.5px">{{c.count}}</div>
        </div>
      </a>
    </sc-for>
  </div>

  <a href="Collection.dc.html" aria-label="New collection" style="position: absolute; right: 18px; bottom: 104px; width: 64px; height: 64px; border-radius: 22px; background: #C6F24E; color: #1E2B00; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(42, 20, 80, 0.22)">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </a>

  <nav aria-label="Main" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: #E9DEF8; border-radius: 999px; padding: 6px; display: flex; gap: 4px; box-shadow: 0 6px 20px rgba(42, 20, 80, 0.18)">
    <a href="Main.dc.html" aria-label="Library" style="width: 52px; height: 52px; border-radius: 999px; color: #4A3F66; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    </a>
    <a href="Collections.dc.html" style="height: 52px; padding: 0 20px; border-radius: 999px; background: #6B3FD4; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 15px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h16v12H4z"/><path d="M6 5h12M8 2h8"/></svg>
      Collections
    </a>
    <a href="Review.dc.html" aria-label="Review" style="width: 52px; height: 52px; border-radius: 999px; color: #4A3F66; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="7" y="4" width="11" height="16" rx="3" transform="rotate(10 12 12)"/><path d="M4 7v11a3 3 0 0 0 3 3"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (bg, ink) => 'min-height: 168px; box-sizing: border-box; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; text-decoration: none; background: ' + bg + '; color: ' + ink + ';';
    const shape = (radius, w, bg, ml, rot) => 'width: ' + w + 'px; height: 58px; border-radius: ' + radius + '; background: ' + bg + '; border: 3px solid rgba(255,255,255,0.9); margin-left: ' + ml + 'px; transform: rotate(' + rot + 'deg);';
    const mk = (name, desc, count, review, bg, ink, a, b, c, href) => ({
      name, desc, count, review, hasReview: review > 0, href: href || 'Collection.dc.html',
      card: card(bg, ink),
      s1: shape('999px', 58, a, 0, 0),
      s2: shape('22px', 46, b, -12, -8),
      s3: shape('999px 999px 18px 18px', 58, c, -12, 6)
    });
    return {
      cols: [
        mk('Memes', 'meme or joke image', 143, 12, '#FFD8EC', '#3E0A2A', '#FF8FC7', '#FFB86B', '#B79CFF'),
        mk('Exam papers', 'exam question papers', 52, 4, '#E5D8FF', '#23005C', '#8F6BFF', '#FFFFFF', '#5A33C9'),
        mk('Chats', 'chat or messaging conversation', 210, 0, '#CFE5FF', '#00264D', '#5AA2FF', '#FFFFFF', '#2E6FD1'),
        mk('Receipts', 'receipt, bill or payment', 18, 2, '#E4F7B5', '#1E2B00', '#9BCB2C', '#FFFFFF', '#5E8A00')
      ]
    };
  }
}
</script>
</body>
</html>
