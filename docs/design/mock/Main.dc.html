<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B3FD4}a:hover{color:#4B22A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF7FF; font-family: 'DM Sans', sans-serif; color: #1E1530">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 28px 16px 120px 16px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.95; letter-spacing: -2.5px; color: #2A1450">Library</h1>
        <div style="font-size: 15px; color: #5B5470; padding-left: 4px">959 screenshots</div>
      </div>
      <button aria-label="Settings" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: #ECE3FA; color: #2A1450; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>

    <label style="height: 58px; border-radius: 999px; background: #ECE3FA; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 20px; color: #4A3F66">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Search your screenshots" placeholder="Search your screenshots" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 500 16px 'DM Sans', sans-serif; color: #1E1530; outline: none">
      <span style="width: 42px; height: 42px; border-radius: 999px; background: #6B3FD4; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </span>
    </label>

    <div style="background: #E5D8FF; border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 44px; height: 44px; border-radius: 16px; background: #6B3FD4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <div style="font-weight: 700; font-size: 16px; color: #23005C">Indexing 412 of 959</div>
          <div style="font-size: 13px; color: #4A3A78">Keep Sift open · about 1 h 40 min left</div>
        </div>
      </div>
      <div style="height: 12px; border-radius: 999px; background: #CDBDF5; overflow: hidden">
        <div style="width: 43%; height: 12px; border-radius: 999px; background: #6B3FD4"></div>
      </div>
    </div>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.8px; color: #2A1450">{{sec.title}}</h2>
          <span style="font-size: 14px; color: #5B5470">{{sec.count}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{sec.items}}" as="t" hint-placeholder-count="6">
            <div style="{{t.tile}}">
              <sc-if value="{{t.chat}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 8px">
                  <div style="align-self: flex-start; width: 70%; height: 14px; border-radius: 8px; background: #FFFFFF"></div>
                  <div style="align-self: flex-end; width: 55%; height: 14px; border-radius: 8px; background: #6B3FD4"></div>
                  <div style="align-self: flex-start; width: 80%; height: 22px; border-radius: 8px; background: #FFFFFF"></div>
                  <div style="align-self: flex-end; width: 40%; height: 14px; border-radius: 8px; background: #6B3FD4"></div>
                </div>
              </sc-if>
              <sc-if value="{{t.text}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 10px">
                  <div style="width: 75%; height: 9px; border-radius: 4px; background: #2A1450"></div>
                  <div style="width: 95%; height: 6px; border-radius: 4px; background: #8E86A6"></div>
                  <div style="width: 88%; height: 6px; border-radius: 4px; background: #8E86A6"></div>
                  <div style="width: 92%; height: 6px; border-radius: 4px; background: #8E86A6"></div>
                  <div style="width: 60%; height: 6px; border-radius: 4px; background: #8E86A6"></div>
                </div>
              </sc-if>
              <sc-if value="{{t.meme}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; align-items: center">
                  <div style="width: 80%; height: 8px; border-radius: 4px; background: #1E1530"></div>
                  <div style="width: 64px; height: 64px; border-radius: 999px; background: #FFB86B"></div>
                  <div style="width: 70%; height: 8px; border-radius: 4px; background: #1E1530"></div>
                </div>
              </sc-if>
              <sc-if value="{{t.game}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; height: 100%; box-sizing: border-box; justify-content: flex-end">
                  <div style="display: flex; gap: 6px"><div style="width: 22px; height: 22px; border-radius: 6px; background: #C6F24E"></div><div style="width: 22px; height: 22px; border-radius: 999px; background: #FF8A65"></div></div>
                  <div style="width: 85%; height: 8px; border-radius: 4px; background: #FFFFFF"></div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: #E9DEF8; border-radius: 999px; padding: 6px; display: flex; gap: 4px; box-shadow: 0 6px 20px rgba(42, 20, 80, 0.18)">
    <a href="Main.dc.html" style="height: 52px; padding: 0 20px; border-radius: 999px; background: #6B3FD4; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 15px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      Library
    </a>
    <a href="Collections.dc.html" aria-label="Collections" style="width: 52px; height: 52px; border-radius: 999px; color: #4A3F66; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h16v12H4z"/><path d="M6 5h12M8 2h8"/></svg>
    </a>
    <a href="Review.dc.html" aria-label="Review" style="width: 52px; height: 52px; border-radius: 999px; color: #4A3F66; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="7" y="4" width="11" height="16" rx="3" transform="rotate(10 12 12)"/><path d="M4 7v11a3 3 0 0 0 3 3"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'height: 168px; border-radius: 18px; overflow: hidden; ';
    const tile = (kind, bg) => ({
      tile: base + 'background: ' + bg + ';',
      chat: kind === 'chat', text: kind === 'text', meme: kind === 'meme', game: kind === 'game'
    });
    return {
      sections: [
        { title: 'Today', count: '6', items: [
          tile('chat', '#DCEBFF'), tile('meme', '#FFF1C2'), tile('text', '#F4F0FA'),
          tile('game', '#3B2A63'), tile('chat', '#E3F6EA'), tile('text', '#FFE6EF')
        ] },
        { title: 'Last week', count: '23', items: [
          tile('meme', '#FFE0D1'), tile('text', '#EEF3FF'), tile('game', '#1F3A4D'),
          tile('chat', '#F0E6FF'), tile('meme', '#E6F7C9'), tile('text', '#FFF4E3')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
